name: 产品反馈 · App feedback
description: 反馈使用问题或提出建议 · Report a problem or suggest an improvement.
body:
  - type: markdown
    attributes:
      value: |
        这里的内容会公开显示。购买凭据、个人资料和私人截图请发到 [guo2184@icloud.com](mailto:guo2184@icloud.com)。
        Issues are public. Please send receipts, personal details and private screenshots to the [support email](mailto:guo2184@icloud.com).
  - type: dropdown
    id: app
    attributes:
      label: 产品 · App
      options:
        - 趣剪 · FunnyCut
        - 番里番茄 · Funny Tomato
        - FunnyTrans
  - type: input
    id: version
    attributes:
      label: App 与系统版本 · App and OS versions
      description: 遇到故障时填写，方便复现。 For a bug, include the app and OS versions if known.
  - type: textarea
    id: feedback
    attributes:
      label: 问题或建议 · Problem or suggestion
      description: 遇到问题时请写明操作步骤、预期和实际结果。提建议时请描述你想完成的事情。 For a problem, include steps, expected and actual results. For a suggestion, describe what you want to do.
    validations:
      required: true
